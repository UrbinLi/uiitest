name: Web QA Midscene

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public or controlled test application URL
        required: true
        type: string

jobs:
  midscene:
    runs-on: ubuntu-latest
    env:
      QA_BASE_URL: ${{ inputs.base_url }}
      MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
      MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
      MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
      MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}

    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify Midscene model secrets
        shell: bash
        run: |
          test -n "$MIDSCENE_MODEL_API_KEY" || { echo "Missing secret MIDSCENE_MODEL_API_KEY"; exit 1; }
          test -n "$MIDSCENE_MODEL_BASE_URL" || { echo "Missing secret MIDSCENE_MODEL_BASE_URL"; exit 1; }
          test -n "$MIDSCENE_MODEL_NAME" || { echo "Missing secret MIDSCENE_MODEL_NAME"; exit 1; }
          test -n "$MIDSCENE_MODEL_FAMILY" || { echo "Missing secret MIDSCENE_MODEL_FAMILY"; exit 1; }

      - name: Run Midscene semantic validation
        run: pnpm qa:ai

      - name: Upload Midscene evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-qa-midscene-evidence
          path: |
            qa/evidence
            qa/reports
            midscene_run
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 30
